# Payment relevance patterns. Names are compared after converting to snake_case.
# A table pattern matches the whole name, its start, or any "_"-separated segment start
# ("payment" matches payments, payment_events, failed_payments).
# A column pattern matches the whole column name, a "pattern_" prefix or a "_pattern" suffix.

tables:
  HIGH:
    - transaction
    - payment
    - transfer
    - settlement
    - payout
    - charge
    - refund
    - ledger
    - webhook_event
    - disbursement
    - remittance
    - withdrawal
    - deposit
  MEDIUM:
    - wallet
    - invoice
    - order
    - subscription
    - customer
    - audit_log
    - beneficiar
    - bank_account
    - card

columns:
  HIGH:
    - pan
    - card_number
    - account_number
    - nuban
    - narration
    - rrn
    - stan
    - terminal_id
    - payment_status
  MEDIUM:
    - bvn
    - bank_code
    - authorization_code
    - amount
  # A money column together with a companion lifts a table to HIGH.
  money:
    - amount
    - total
    - subtotal
    - price
    - fee
    - balance
  # Minor-unit columns count as money too: price_cents, amount_kobo.
  moneySuffixes:
    - cents
    - kobo
    - minor
  moneyCompanions:
    - currency
    - reference
